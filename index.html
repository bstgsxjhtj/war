<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>古代冷兵器对战 · Ancient Warfare</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #0b0f14; overflow: hidden; }
    #app { width: 100vw; height: 100vh; }
    canvas { display: block; }
    #loading-screen { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0b0f14; color: #c8d0d8; font-family: 'Microsoft YaHei', sans-serif; transition: opacity 0.4s; }
    #loading-screen.hidden { opacity: 0; pointer-events: none; }
    #loading-spinner { width: 48px; height: 48px; border: 4px solid #1a2530; border-top-color: #4a90d9; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 20px; }
    #loading-text { font-size: 18px; letter-spacing: 4px; opacity: 0.8; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading-screen"><div id="loading-spinner"></div><div id="loading-text">加载中</div></div>
  <div id="app"></div>
  <script type="module" src="/src/main_entry.js"></script>
</body>
</html>
